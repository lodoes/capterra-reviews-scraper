                        "surface-bright": "#f7f9fb",
                        "on-tertiary-container": "#009485",
                        "on-secondary-fixed": "#07006c",
                        "secondary": "#4648d4",
                        "secondary-container": "#6063ee",
                        "secondary-fixed-dim": "#c0c1ff",
                        "surface-container": "#eceef0",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#565e74",
                        "surface": "#f7f9fb",
                        "primary-container": "#131b2e",
                        "tertiary-fixed": "#71f8e4",
                        "background": "#f7f9fb",
                        "surface-variant": "#e0e3e5",
                        "inverse-surface": "#2d3133",
                        "tertiary": "#000000",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#00201c",

                        "on-background": "#191c1e",

                        "surface-container-high": "#e6e8ea",
                        "inverse-primary": "#bec6e0",
                        "outline": "#76777d",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary-container": "#fffbff",
                        "on-surface": "#191c1e",
                        "error": "#ba1a1a",
                        "on-primary-fixed": "#131b2e",
                        "on-primary-container": "#7c839b",
                        "primary-fixed": "#dae2fd",
                        "surface-dim": "#d8dadc",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#005048"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "sm": "12px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "base": "8px",
                        "md": "24px",
                        "xl": "64px",
                        "margin-desktop": "48px",
                        "lg": "40px"
                    },
                    "fontFamily": {
                        "plusJakartaSans": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {

                        "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400"}],

                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .data-card-shadow {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.03);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease-out;
        }
        .data-card-shadow:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08);
        }
        .chart-grid {
            background-image: linear-gradient(#f1f5f9 1px, transparent 1px), linear-gradient(90deg, #f1f5f9 1px, transparent 1px);
            background-size: 40px 40px;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md selection:bg-secondary-fixed selection:text-on-secondary-fixed">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
